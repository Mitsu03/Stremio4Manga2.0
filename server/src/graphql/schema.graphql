# -------------------------------------------------------- source browsing --

input FetchSourceMangaInput {
  source: LongString!
  type: FetchSourceMangaType!
  page: Int!
  query: String
  filters: [FilterChangeInput!]
}

type FetchSourceMangaPayload {
  hasNextPage: Boolean!
  mangas: [MangaType!]!
}

"""
Search several sources in one request. The client fans out over the sources a
person actually reads from, and a source that fails must not fail the others —
hence a per-source error rather than a top-level one.
"""
input FetchSourceMangaBulkInput {
  sources: [LongString!]!
  type: FetchSourceMangaType!
  page: Int!
  query: String
  """
  Give each source longer to answer before the batch moves on.

  Off, a source has a few seconds: one slow site otherwise holds up every source
  in its batch, and the tail of a sweep becomes the whole wait. On, the slow ones
  are waited for — worth it when the answer matters more than the minute.
  """
  waitLonger: Boolean
}

type BulkSourceResult {
  source: LongString!
  error: String
  mangas: [MangaType!]!
}

type FetchSourceMangaBulkPayload {
  results: [BulkSourceResult!]!
}

