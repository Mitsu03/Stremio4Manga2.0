# ---------------------------------------------------------------- tracking --

type TrackerUserType {
  name: String!
  avatarUrl: String
}

type TrackerType {
  id: Int!
  name: String!
  icon: String!
  isLoggedIn: Boolean!
  isTokenExpired: Boolean!
  """Where to send the browser to start OAuth; the client rewrites `state`."""
  authUrl: String
  """
  Whether the client must generate a PKCE verifier, put it on `authUrl` as
  `code_challenge`, hold it across the navigation and hand it back to
  `loginTrackerOAuth`. False for an implicit grant, which has nothing to
  exchange and so nothing to remember.
  """
  authRequiresVerifier: Boolean!
  """Resolved from the tracker the first time it is asked for; null when unreachable."""
  user: TrackerUserType
}

type TrackRecordType {
  id: Int!
  mangaId: Int!
  trackerId: Int!
  remoteId: LongString!
  title: String!
  lastChapterRead: Float!
  totalChapters: Int!
  status: Int!
  """Non-null; 0 means never scored."""
  score: Float!
  remoteUrl: String!
  startDate: LongString!
  finishDate: LongString!
}

type TrackRecordNodeList {
  nodes: [TrackRecordType!]!
  totalCount: Int!
}

type TrackSearchType {
  remoteId: LongString!
