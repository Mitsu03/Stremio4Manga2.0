"""
The whole API the Inkstream UI speaks, and nothing else.

This is deliberately not the Suwayomi schema. It is the subset that the client
actually sends — every operation in web/src was read off and represented here —
so that the surface to implement is finite and each resolver group can be built
against a contract that is already fixed.

Two conventions carried over from the server this replaces, because the client
depends on both:

  * `LongString` is a 64-bit integer serialised as a decimal string. Every
    epoch-millisecond field uses it (lastReadAt, uploadDate, inLibraryAt), as do
    source ids and tracker remote ids.
  * List arguments accept a single object (GraphQL input coercion), which is why
    `order: { by: SOURCE_ORDER }` and `order: [{ by: LAST_READ_AT, byType: DESC }]`
    are both valid against the same field.
"""

scalar LongString
scalar Upload

# ------------------------------------------------------------------- enums --

enum MangaStatus {
  UNKNOWN
  ONGOING
  COMPLETED
  LICENSED
  PUBLISHING_FINISHED
  CANCELLED
  ON_HIATUS
}

enum ContentWarning {
  SAFE
  MIXED
  NSFW
}

enum FetchSourceMangaType {
  POPULAR
  LATEST
  SEARCH
}

enum TriState {
  IGNORE
  INCLUDE
  EXCLUDE
}

enum SortOrder {
  ASC
  DESC
}

enum ChapterOrderBy {
  ID
  SOURCE_ORDER
  CHAPTER_NUMBER
  UPLOAD_DATE
  LAST_READ_AT
  FETCHED_AT
}

enum MangaOrderBy {
  ID
  TITLE
  IN_LIBRARY_AT
}

enum ExtensionOrderBy {
  PKG_NAME
  NAME
  LANG
}

enum DownloadState {
  QUEUED
  DOWNLOADING
  FINISHED
  ERROR
}

enum DownloaderState {
  STARTED
  STOPPED
}

enum BackupRestoreState {
  IDLE
  SUCCESS
  FAILURE
  RESTORING_CATEGORIES
  RESTORING_MANGA
  RESTORING_META
  RESTORING_SETTINGS
}

# ------------------------------------------------------------------ source --

type SourceType {
  id: LongString!
  name: String!
  lang: String!
  iconUrl: String
  supportsLatest: Boolean!
  contentWarning: ContentWarning!
  isNsfw: Boolean!
  displayName: String!
  """The questions this source knows how to answer, in the order their position means."""
  filters: [Filter!]!
}

type SourceNodeList {
  nodes: [SourceType!]!
  totalCount: Int!
}

"""
A union rather than an interface: the eight shapes share only a name, and the
three `default` fields have three different types, which the client aliases apart.
"""
union Filter =
    HeaderFilter
  | SeparatorFilter
  | SelectFilter
  | TextFilter
  | CheckBoxFilter
  | TriStateFilter
  | SortFilter
  | GroupFilter

type HeaderFilter {
  name: String!
}

type SeparatorFilter {
  name: String!
}

type SelectFilter {
  name: String!
  values: [String!]!
  default: Int!
}

type TextFilter {
  name: String!
  default: String!
}

type CheckBoxFilter {
  name: String!
  default: Boolean!
}

type TriStateFilter {
  name: String!
  default: TriState!
}

type SortSelection {
  index: Int!
  ascending: Boolean!
}

type SortFilter {
  name: String!
  values: [String!]!
  """Null when the source ships no sort preference of its own."""
  default: SortSelection
}

type GroupFilter {
  name: String!
  """One level deep only — a group inside a group could never be sent back."""
  filters: [Filter!]!
}

"""
Going the other way the shape is flat, not polymorphic: one input carries
whichever state field belongs to the filter sitting at `position`.
"""
input FilterChangeInput {
  position: Int!
  selectState: Int
  textState: String
  checkBoxState: Boolean
  triState: TriState
  sortState: SortSelectionInput
  groupChange: FilterChangeInput
}

input SortSelectionInput {
  index: Int!
  ascending: Boolean!
}

# ----------------------------------------------------------------- library --

type MangaType {
