# ---------------------------------------------------------------- chapters --

type ChapterType {
  id: Int!
  mangaId: Int!
  manga: MangaType!
  url: String!
  name: String!
  scanlator: String
  chapterNumber: Float!
  """
  Position in the list the source returned, 1-based. This — not the row id — is
  what the reader's routes carry.
  """
  sourceOrder: Int!
  uploadDate: LongString!
  realUrl: String
  isRead: Boolean!
  isBookmarked: Boolean!
  isDownloaded: Boolean!
  lastPageRead: Int!
  """
  Stamped by the reader's progress PATCH only. updateChapters(isRead) leaves it
  alone, so catching up on a backlog does not fill the continue-reading shelf.
  """
  lastReadAt: LongString!
  pageCount: Int!
  fetchedAt: LongString!
}

type ChapterNodeList {
  nodes: [ChapterType!]!
  totalCount: Int!
}

input ChapterConditionInput {
  id: Int
  mangaId: Int
  isRead: Boolean
  isDownloaded: Boolean
  isBookmarked: Boolean
}

input ChapterFilterInput {
  id: IntFilterInput
  mangaId: IntFilterInput
  isRead: BooleanFilterInput
  isDownloaded: BooleanFilterInput
  isBookmarked: BooleanFilterInput
  lastReadAt: LongFilterInput
}

input ChapterOrderInput {
  by: ChapterOrderBy!
  byType: SortOrder
}

input UpdateChapterPatchInput {
  isRead: Boolean
  isBookmarked: Boolean
  lastPageRead: Int
}

input UpdateChaptersInput {
  ids: [Int!]!
  patch: UpdateChapterPatchInput!
}

type UpdateChaptersPayload {
  chapters: [ChapterType!]!
}

input FetchChaptersInput {
  mangaId: Int!
}

type FetchChaptersPayload {
  chapters: [ChapterType!]!
}

input FetchChapterPagesInput {
  chapterId: Int!
}

type FetchChapterPagesPayload {
  """Same-origin relative URLs, used directly as <img src>."""
